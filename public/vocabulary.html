<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙語閱讀 · 單字本</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="vocabulary.css"></head>
<body><header class="notebook-header"><a href="vocabulary.html" class="brand"><span class="brand-mark" aria-hidden="true">字</span><span>雙語閱讀<small>把查過的字，變成記得的字。</small></span></a><button id="settings" class="secondary">設定</button></header>
<main class="notebook"><div class="intro"><div><p class="eyebrow">MY VOCABULARY</p><h1>我的單字本</h1><p class="muted">收藏閱讀中遇見的單字與片語，連同當時的語境一起複習。</p></div><div class="summary"><strong id="total">0</strong><span>已收藏</span><strong id="due">0</strong><span>待複習</span></div></div>
<div class="toolbar"><label class="search"><span class="sr-only">搜尋單字、片語或詞意</span><input id="search" type="search" placeholder="搜尋單字、片語或詞意"></label><div class="segmented" role="group" aria-label="單字本檢視"><button id="browse" class="selected" aria-pressed="true">全部單字</button><button id="review" aria-pressed="false">開始複習</button></div><button id="refresh" class="secondary">重新整理</button><button id="export" class="secondary">匯出備份</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p><section id="cards" aria-label="收藏的單字"></section><div id="pagination" class="pagination"><button id="previous" class="secondary">上一頁</button><span id="page"></span><button id="next" class="secondary">下一頁</button></div>
<p class="hint">單字本儲存在這台裝置。到網頁啟用「懸停查詞」，按住 Ctrl 停留單字或已反白的短片語，點小圖標查詞，再按「加入單字本」。反白文字按 Alt+Q 則使用一般翻譯。查詞內容由你設定的 AI 服務產生。</p></main><script src="ui/vocabulary.js"></script></body></html>
