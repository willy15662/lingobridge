<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙語閱讀</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><header class="popup-header"><div class="brand-mark" aria-hidden="true">文</div><div><h1>雙語閱讀</h1><span class="muted">讓語言不再打斷閱讀</span></div><button id="settings" class="icon-button" aria-label="開啟設定" title="開啟設定">⚙</button></header><main><p id="site" class="site-label">讀取目前網站…</p><div class="segmented" role="group" aria-label="閱讀模式"><button data-mode="original">原文</button><button data-mode="bilingual" class="selected">雙語對照</button><button data-mode="translated">僅譯文</button></div><div class="language-row"><label>原文語言<select id="source"></select></label><span aria-hidden="true">→</span><label>目標語言<select id="target"></select></label></div><label class="field">翻譯服務<select id="provider"><option value="openai">OpenAI</option><option value="gemini">Gemini</option><option value="deepl">DeepL</option></select></label><button id="translate" class="primary full">翻譯此頁</button><div class="site-rule-row"><select id="site-rule" aria-label="此網站的翻譯規則"><option value="always">一律翻譯這個網站</option><option value="never">不要翻譯這個網站</option></select><input type="checkbox" id="always" role="switch" aria-label="啟用此網站規則"></div><div id="status" class="status" role="status" aria-live="polite"></div><label class="check-row"><input type="checkbox" id="hover"><span>懸停查詞<small>Ctrl 停留顯示查詞圖標；反白翻譯按 Alt+Q。</small></span></label><div class="popup-tip">啟用後適用目前分頁；持續使用可在設定授權網站。<br>查詞與例句需要 OpenAI 或 Gemini。</div></main><footer class="popup-footer"><button id="sidepanel" class="text-button">文字翻譯</button><button id="vocabulary" class="text-button">單字本</button><button id="documents" class="text-button">文件與字幕</button><button id="shortcuts" class="text-button">快捷鍵</button><span class="local-badge">本機設定</span></footer><script src="ui/popup.js"></script></body></html>
